<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email preferences — Netflux</title>
<link rel="stylesheet" href="../assets/netflux.css">
</head>
<body>
<div data-nf-nav data-active="home"></div>
<main>
  <div class="acct-card">
    <h1>Don't miss your next favourite</h1>
    <p>Marketing preferences for <strong>demo@netflux.test</strong></p>
    <form action="reduced.html">
      <label><input type="radio" name="frequency" value="weekly" checked> Reduce to weekly highlights</label>
      <p>Keep discovering great shows, with fewer emails.</p>
      <button class="btn btn-primary" type="submit">Save my unsubscribe preferences</button>
    </form>
    <details style="margin-top:32px;color:var(--muted);font-size:12px">
      <summary>Other delivery options</summary>
      <p><a href="survey.html" style="color:var(--muted);font-size:11px">No thanks, I prefer to miss out — unsubscribe from all</a></p>
    </details>
  </div>
</main>
<div data-nf-footer></div>
<script src="../assets/app.js" defer></script>
</body>
</html>
