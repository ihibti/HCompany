<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm it's you — Netflux</title>
<link rel="stylesheet" href="../assets/netflux.css">
</head>
<body>
<div data-nf-nav data-active="home"></div>
<main>
  <div class="acct-card nf-form" style="max-width:440px;margin:60px auto">
    <h2>Confirm it's you</h2>
    <p style="color:var(--muted);font-size:14px">For your security, please re-enter your account details to continue to Customer Happiness.</p>

    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="off" placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="off" placeholder="Your Netflux password">

    <div class="nf-error" id="login-error">Incorrect email or password. Please try again.</div>

    <div style="margin-top:20px">
      <button class="btn btn-primary" id="login-btn" style="width:100%">Continue</button>
    </div>
    <p style="font-size:12px;color:#777;margin-top:14px"><a href="index.html" style="color:#8b8b8b">← Back to account</a></p>
  </div>
</main>
<div data-nf-footer></div>
<script src="../assets/app.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("login-btn").addEventListener("click", function () {
      var email = document.getElementById("email").value.trim();
      var pass = document.getElementById("password").value;
      if (email === "demo@netflux.test" && pass === "Hatch-2026") {
        window.location.href = "chat.html";
      } else {
        document.getElementById("login-error").style.display = "block";
      }
    });
    document.getElementById("password").addEventListener("keydown", function (e) {
      if (e.key === "Enter") document.getElementById("login-btn").click();
    });
  });
</script>
</body>
</html>
