<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage plan — Netflux</title>
<link rel="stylesheet" href="../assets/netflux.css">
</head>
<body>
<div data-nf-nav data-active="home"></div>
<main>
  <div class="acct-card" style="max-width:640px">
    <h2>Manage your plan</h2>
    <div class="plan">Netflux Premium · $15.99/month</div>

    <div style="background:linear-gradient(120deg,#3d0a12,#1a0508);border:1px solid #7a1f2b;border-radius:12px;padding:22px;margin:18px 0">
      <div style="font-size:19px;font-weight:800">Wait — stay for half price! 🎉</div>
      <p style="color:var(--muted);font-size:14px;margin:8px 0 16px">Keep Netflux Premium for only <b style="color:#fff">$7.99/month</b> for the next 6 months. You'd be crazy to leave.</p>
      <a class="btn btn-primary" href="kept.html" style="font-size:17px;padding:14px 34px">Keep my 50% off</a>
    </div>

    <p style="font-size:13px;color:var(--muted)">
      Changed your mind about your plan?
      <a href="confirm.html" style="color:#8b8b8b;text-decoration:underline">No thanks, I enjoy paying full price</a>
    </p>
  </div>
</main>
<div data-nf-footer></div>
<script src="../assets/app.js" defer></script>
