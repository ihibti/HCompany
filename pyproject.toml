[project]
name = "escapehatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ihibti", email = "ismaelhibti2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hai-agents>=1.4.3",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
]

[project.scripts]
escapehatch = "escapehatch:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
